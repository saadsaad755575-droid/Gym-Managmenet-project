

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Workout Plans</title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- MEMBER COMPONENTS -->
    <link
        rel="stylesheet"
        href="../../../components/member-sidebar/member-sidebar.css"
    >

    <link
        rel="stylesheet"
        href="../../../components/member-navbar/member-navbar.css"
    >

    <!-- PAGE CSS -->
    <link
        rel="stylesheet"
        href="my-workout.css"
    >

</head>


<body>

    <!-- =========================
         MEMBER SIDEBAR
    ========================== -->

    <div id="member-sidebar"></div>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="member-main">

        <!-- NAVBAR -->

        <div id="member-navbar"></div>


        <!-- =========================
             PAGE CONTENT
        ========================== -->

        <div class="workout-content">

            <!-- PAGE HEADER -->

            <section class="page-header">

                <div>

                    <span class="page-label">
                        <i class="fa-solid fa-dumbbell"></i>
                        MEMBER WORKOUT
                    </span>

                    <h1>
                        My Workout Plans
                    </h1>

                    <p>
                        Your personalized workout plans assigned by your trainer.
                    </p>

                </div>

            </section>


            <!-- =========================
                 PLAN CONTAINER
            ========================== -->

            <section
                class="workout-plans"
                id="workoutPlansContainer"
            >

                <!-- JavaScript will load plans here -->

            </section>


            <!-- EMPTY STATE -->

            <section
                class="empty-workout"
                id="emptyWorkout"
            >

                <div class="empty-icon">

                    <i class="fa-solid fa-dumbbell"></i>

                </div>

                <h2>
                    No Workout Plan Assigned
                </h2>

                <p>
                    Your trainer has not assigned a workout plan yet.
                </p>

            </section>

        </div>

    </main>


    <!-- =========================
         COMPONENT JS
    ========================== -->

    <script src="../../../components/member-sidebar/member-sidebar.js"></script>

    <script src="../../../components/member-navbar/member-navbar.js"></script>


    <!-- PAGE JS -->

    <script src="my-workot.js"></script>

</body>

</html>
