

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Sidebar</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Trainer Sidebar CSS -->
    <link rel="stylesheet" href="trainer.sidebar.css">
<link rel="stylesheet" href="/components/animations/animtion.css">
</head>


<body>

    <!-- =========================================
         TRAINER SIDEBAR
    ========================================== -->

    <aside class="trainer-sidebar">


        <!-- =========================================
             LOGO
        ========================================== -->

        <div class="sidebar-logo">

            <div class="logo-icon">
                <i class="fa-solid fa-dumbbell"></i>
            </div>

            <div class="logo-text">
                <h2>GYM</h2>
                <span>MANAGEMENT</span>
            </div>

        </div>


        <!-- =========================================
             TRAINER PROFILE
        ========================================== -->

        <div class="trainer-profile">

            <div class="trainer-avatar">

                <i class="fa-solid fa-user"></i>

            </div>


            <div class="trainer-details">

                <h3>Trainer</h3>

                <p>Fitness Trainer</p>

            </div>

        </div>


        <!-- =========================================
             NAVIGATION
        ========================================== -->

        <nav class="trainer-navigation">

            <ul>


                <!-- Dashboard -->

                <li class="active">

                    <a href="/Trainer-dashboard/trainer.html">

                        <i class="fa-solid fa-house"></i>

                        <span>Dashboard</span>

                    </a>

                </li>


                <!-- My Customers -->

                <li>

                    <a href="/Trainer-dashboard/pages/My-Customer/my-customer.html">

                        <i class="fa-solid fa-users"></i>

                        <span>My Customers</span>

                    </a>

                </li>


                <!-- Workout Plans -->

                <li>

                    <a href="/Trainer-dashboard/pages/Workout-plan/workout-plan.html">

                        <i class="fa-solid fa-dumbbell"></i>

                        <span>Workout Plans</span>

                    </a>

                </li>


                <!-- Diet Plans -->

                <li>

                    <a href="/Trainer-dashboard/pages/Diet -plan/diet-plan.html">

                        <i class="fa-solid fa-apple-whole"></i>

                        <span>Diet Plans</span>

                    </a>

                </li>


                <!-- Attendance -->

                <li>

                    <a href="/Trainer-dashboard/pages/Attendance/attendance.html">

                        <i class="fa-solid fa-calendar-check"></i>

                        <span>Attendance</span>

                    </a>

                </li>


                <!-- Customer Progress -->

                <li>

                    <a href="/Trainer-dashboard/pages/Customer-progress/customer-progress.html">

                        <i class="fa-solid fa-chart-line"></i>

                        <span>Customer Progress</span>

                    </a>

                </li>


                <!-- Schedule -->

                <li>

                    <a href="/Trainer-dashboard/pages/schedule/schedule.html">

                        <i class="fa-regular fa-calendar"></i>

                        <span>Schedule</span>

                    </a>

                </li>


                <!-- Availability -->

                <li>

                    <a href="/Trainer-dashboard/pages/Availability/availability.html">

                        <i class="fa-solid fa-clock"></i>

                        <span>Availability</span>

                    </a>

                </li>


                <!-- Notifications -->

                <li>

                    <a href="/Trainer-dashboard/pages/Notifiction/notification.html">

                        <i class="fa-solid fa-bell"></i>

                        <span>Notifications</span>

                    </a>

                </li>


                <!-- My Profile -->

                <li>

                    <a href="/Trainer-dashboard/pages/My-profile/my-profile.html">

                        <i class="fa-solid fa-user-gear"></i>

                        <span>My Profile</span>

                    </a>

                </li>


            </ul>

        </nav>


        <!-- =========================================
             LOGOUT
        ========================================== -->

        <div class="sidebar-logout">

            <a href="/Login/login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </a>

        </div>


    </aside>


    <!-- =========================================
         TRAINER SIDEBAR JS
    ========================================== -->

    <script src="trainer.sidebar.js"></script

</body>

</html>
