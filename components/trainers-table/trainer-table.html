

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Table</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Trainer Table CSS -->
    <link rel="stylesheet" href="trainer-table.css">
    <link rel="stylesheet" href="/components/animations/animtion.css">

</head>


<body>

    <!-- =========================================
         TRAINER TABLE
    ========================================== -->

    <section class="trainer-table-container">


        <!-- =========================================
             TABLE HEADER
        ========================================== -->

        <div class="trainer-table-header">

            <div>

                <h2>My Customers</h2>

                <p>Customers assigned to you</p>

            </div>


            <button class="view-all-btn">

                View All

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </div>


        <!-- =========================================
             TABLE
        ========================================== -->

        <div class="trainer-table-wrapper">

            <table class="trainer-table">

                <thead>

                    <tr>

                        <th>Customer</th>

                        <th>Goal</th>

                        <th>Workout Plan</th>

                        <th>Progress</th>

                        <th>Attendance</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody>


                    <!-- Customer 1 -->

                    <tr>

                        <td>

                            <div class="customer-info">

                                <div class="customer-avatar">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                <div>

                                    <h4>Ahmed Khan</h4>

                                    <span>MEM-001</span>

                                </div>

                            </div>

                        </td>


                        <td>Weight Loss</td>


                        <td>Fat Burn</td>


                        <td>

                            <div class="progress-container">

                                <div class="progress-bar">

                                    <span style="width: 70%;"></span>

                                </div>

                                <small>70%</small>

                            </div>

                        </td>


                        <td>85%</td>


                        <td>

                            <span class="status active">
                                Active
                            </span>

                        </td>


                        <td>

                            <button class="action-btn view-btn"
                                    title="View Customer">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                            <button class="action-btn edit-btn"
                                    title="Edit">

                                <i class="fa-solid fa-pen"></i>

                            </button>

                        </td>

                    </tr>


                    <!-- Customer 2 -->

                    <tr>

                        <td>

                            <div class="customer-info">

                                <div class="customer-avatar">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                <div>

                                    <h4>Ali Raza</h4>

                                    <span>MEM-002</span>

                                </div>

                            </div>

                        </td>


                        <td>Muscle Gain</td>


                        <td>Strength</td>


                        <td>

                            <div class="progress-container">

                                <div class="progress-bar">

                                    <span style="width: 55%;"></span>

                                </div>

                                <small>55%</small>

                            </div>

                        </td>


                        <td>78%</td>


                        <td>

                            <span class="status active">
                                Active
                            </span>

                        </td>


                        <td>

                            <button class="action-btn view-btn"
                                    title="View Customer">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                            <button class="action-btn edit-btn"
                                    title="Edit">

                                <i class="fa-solid fa-pen"></i>

                            </button>

                        </td>

                    </tr>


                    <!-- Customer 3 -->

                    <tr>

                        <td>

                            <div class="customer-info">

                                <div class="customer-avatar">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                <div>

                                    <h4>Usman Ahmed</h4>

                                    <span>MEM-003</span>

                                </div>

                            </div>

                        </td>


                        <td>Fitness</td>


                        <td>Full Body</td>


                        <td>

                            <div class="progress-container">

                                <div class="progress-bar">

                                    <span style="width: 82%;"></span>

                                </div>

                                <small>82%</small>

                            </div>

                        </td>


                        <td>92%</td>


                        <td>

                            <span class="status active">
                                Active
                            </span>

                        </td>


                        <td>

                            <button class="action-btn view-btn"
                                    title="View Customer">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                            <button class="action-btn edit-btn"
                                    title="Edit">

                                <i class="fa-solid fa-pen"></i>

                            </button>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </section>


</body>

</html>
