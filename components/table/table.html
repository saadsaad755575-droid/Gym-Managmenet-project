<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Table</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Table CSS -->
    <link rel="stylesheet" href="table.css">

</head>


<body>


    <!-- =========================
         DASHBOARD TABLE
    ========================== -->

    <div class="dashboard-table">


        <!-- Table Header -->

        <div class="table-header">

            <div>

                <h3>Recent Members</h3>

                <p>Latest registered members</p>

            </div>


            <button class="table-view-btn">
                View All
            </button>

        </div>


        <!-- Table Wrapper -->

        <div class="table-wrapper">

            <table>


                <!-- Table Head -->

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Member</th>

                        <th>Plan</th>

                        <th>Status</th>

                        <th>Join Date</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <!-- Table Body -->

                <tbody>


                    <!-- Member 1 -->

                    <tr>

                        <td>#001</td>


                        <td>

                            <div class="member-info">

                                <div class="member-avatar">

                                    <i class="fa-solid fa-user"></i>

                                </div>

                                <span>Ahmed Khan</span>

                            </div>

                        </td>


                        <td>Premium</td>


                        <td>

                            <span class="table-status active">
                                Active
                            </span>

                        </td>


                        <td>01 Sep 2026</td>


                        <td>

                            <div class="table-actions">

                                <button title="View">

                                    <i class="fa-solid fa-eye"></i>

                                </button>


                                <button title="Edit">

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button title="Delete">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>


                    <!-- Member 2 -->

                    <tr>

                        <td>#002</td>


                        <td>

                            <div class="member-info">

                                <div class="member-avatar">

                                    <i class="fa-solid fa-user"></i>

                                </div>

                                <span>Husain</span>

                            </div>

                        </td>


                        <td>Standard</td>


                        <td>

                            <span class="table-status active">
                                Active
                            </span>

                        </td>


                        <td>30 Aug 2026</td>


                        <td>

                            <div class="table-actions">

                                <button title="View">

                                    <i class="fa-solid fa-eye"></i>

                                </button>


                                <button title="Edit">

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button title="Delete">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>


                    <!-- Member 3 -->

                    <tr>

                        <td>#003</td>


                        <td>

                            <div class="member-info">

                                <div class="member-avatar">

                                    <i class="fa-solid fa-user"></i>

                                </div>

                                <span>Talha</span>

                            </div>

                        </td>


                        <td>Basic</td>


                        <td>

                            <span class="table-status pending">
                                Pending
                            </span>

                        </td>


                        <td>29 Aug 2026</td>


                        <td>

                            <div class="table-actions">

                                <button title="View">

                                    <i class="fa-solid fa-eye"></i>

                                </button>


                                <button title="Edit">

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button title="Delete">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>


                    <!-- Member 4 -->

                    <tr>

                        <td>#004</td>


                        <td>

                            <div class="member-info">

                                <div class="member-avatar">

                                    <i class="fa-solid fa-user"></i>

                                </div>

                                <span>Saad</span>

                            </div>

                        </td>


                        <td>Premium</td>


                        <td>

                            <span class="table-status expired">
                                Expired
                            </span>

                        </td>


                        <td>25 Aug 2026</td>


                        <td>

                            <div class="table-actions">

                                <button title="View">

                                    <i class="fa-solid fa-eye"></i>

                                </button>


                                <button title="Edit">

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button title="Delete">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </div>


    <!-- Table JavaScript -->
    <script src="table.js"></script>


</body>

</html>
