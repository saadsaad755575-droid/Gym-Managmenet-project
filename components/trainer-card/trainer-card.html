

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Dashboard Cards</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Trainer Card CSS -->
    <link rel="stylesheet" href="trainer-card.css">
    <link rel="stylesheet" href="/components/animations/animtion.css">
</head>

<body>

    <!-- =========================
         TRAINER DASHBOARD CARDS
    ========================== -->

    <section class="trainer-cards">

        <!-- My Members -->
        <div class="trainer-card">

            <div class="card-icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <div class="card-content">
                <p>My Members</p>
                <h2>8</h2>
                <span>Assigned Members</span>
            </div>

        </div>


        <!-- Today's Workouts -->
        <div class="trainer-card">

            <div class="card-icon">
                <i class="fa-solid fa-dumbbell"></i>
            </div>

            <div class="card-content">
                <p>Today's Workouts</p>
                <h2>5</h2>
                <span>Scheduled Workouts</span>
            </div>

        </div>


        <!-- Today's Diet Plans -->
        <div class="trainer-card">

            <div class="card-icon">
                <i class="fa-solid fa-utensils"></i>
            </div>

            <div class="card-content">
                <p>Today's Diet Plans</p>
                <h2>4</h2>
                <span>Active Diet Plans</span>
            </div>

        </div>


        <!-- Trainer Availability -->
        <div class="trainer-card">

            <div class="card-icon">
                <i class="fa-solid fa-calendar-check"></i>
            </div>

            <div class="card-content">
                <p>Trainer Availability</p>
                <h2>Available</h2>
                <span>Current Status</span>
            </div>

        </div>

    </section>

</body>

</html>
