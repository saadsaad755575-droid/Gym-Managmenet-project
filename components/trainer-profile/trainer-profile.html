

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Profile</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Trainer Profile CSS -->
    <link rel="stylesheet" href="trainer-profile.css">
</head>

<body>

    <!-- =========================
         TRAINER PROFILE OVERVIEW
    ========================== -->

    <section class="trainer-profile-card">

        <!-- Trainer Basic Information -->
        <div class="trainer-profile-left">

            <div class="trainer-profile-image">
                <i class="fa-solid fa-user-tie"></i>
            </div>

            <div class="trainer-profile-name">

                <h2 id="trainerProfileName">Ahmed Khan</h2>

                <p id="trainerProfileType">Senior Fitness Trainer</p>

                <span>
                    Trainer ID:
                    <span id="trainerProfileId">TRN-001</span>
                </span>

            </div>

        </div>


        <!-- Trainer Professional Information -->
        <div class="trainer-profile-info">

            <!-- Qualification -->
            <div class="profile-item">

                <i class="fa-solid fa-graduation-cap"></i>

                <div>
                    <span>Qualification</span>
                    <strong id="trainerProfileQualification">
                        Certified Fitness Trainer
                    </strong>
                </div>

            </div>


            <!-- Experience -->
            <div class="profile-item">

                <i class="fa-solid fa-briefcase"></i>

                <div>
                    <span>Experience</span>
                    <strong id="trainerProfileExperience">
                        5 Years
                    </strong>
                </div>

            </div>


            <!-- Specialization -->
            <div class="profile-item">

                <i class="fa-solid fa-dumbbell"></i>

                <div>
                    <span>Specialization</span>
                    <strong id="trainerProfileSpecialization">
                        Strength & Fitness
                    </strong>
                </div>

            </div>


            <!-- Availability -->
            <div class="profile-item">

                <i class="fa-solid fa-calendar-check"></i>

                <div>
                    <span>Availability</span>
                    <strong
                        id="trainerProfileAvailability"
                        class="available-status">
                        Available
                    </strong>
                </div>

            </div>

        </div>


        <!-- Skills & Services -->
        <div class="trainer-profile-extra">

            <!-- Skills -->
            <div class="profile-section">

                <h3>
                    <i class="fa-solid fa-star"></i>
                    Skills
                </h3>

                <div
                    class="profile-tags"
                    id="trainerProfileSkills">
                </div>

            </div>


            <!-- Services -->
            <div class="profile-section">

                <h3>
                    <i class="fa-solid fa-list-check"></i>
                    Services
                </h3>

                <div
                    class="profile-tags"
                    id="trainerProfileServices">
                </div>

            </div>

        </div>

    </section>
<script>"trainer-profile.js"</script>
</body>

</html>
