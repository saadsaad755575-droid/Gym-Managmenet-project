<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Member Sidebar</title>


    <!-- ========================================
         FONT AWESOME
    ========================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ========================================
         MEMBER SIDEBAR CSS
    ========================================= -->

    <link
        rel="stylesheet"href="member-sidebar.css"
    >

</head>


<body>


    <!-- ========================================
         MEMBER SIDEBAR
    ========================================= -->

    <aside class="member-sidebar">


        <!-- ====================================
             SIDEBAR HEADER
        ===================================== -->

        <div class="member-sidebar-header">

            <div class="member-logo">

                <i class="fa-solid fa-dumbbell fa-beat"></i>

            </div>


            <div class="member-brand">

                <h2>GYM</h2>

                <span>MEMBER PANEL</span>

            </div>

        </div>



        <!-- ====================================
             MEMBER PROFILE
        ===================================== -->

        <div class="member-sidebar-profile">


            <div class="member-profile-image">

                <i class="fa-solid fa-user fa-fade"></i>

            </div>


            <div class="member-profile-info">

                <h3 id="sidebarMemberName">
                    Member Name
                </h3>

                <span>
                    Member
                </span>

            </div>

        </div>



        <!-- ====================================
             SIDEBAR MENU
        ===================================== -->

        <nav class="member-sidebar-menu">


            <!-- DASHBOARD -->

            <a
                href="#"
                class="member-menu-item active">

                <i class="fa-solid fa-house"></i>

                <span>
                    Dashboard
                </span>

            </a>



            <!-- MY PROFILE -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-user"></i>

                <span>
                    My Profile
                </span>

            </a>



            <!-- FIND MY TRAINER -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-magnifying-glass fa-beat"></i>

                <span>
                    Find My Trainer
                </span>

            </a>



            <!-- MY WORKOUT PLANS -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-dumbbell fa-bounce"></i>

                <span>
                    My Workout Plans
                </span>

            </a>



            <!-- MY DIET PLAN -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-apple-whole fa-beat"></i>

                <span>
                    My Diet Plan
                </span>

            </a>



            <!-- MY ATTENDANCE -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-calendar-check fa-beat"></i>

                <span>
                    My Attendance
                </span>

            </a>



            <!-- MY FEES -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-money-bill-wave"></i>

                <span>
                    My Fees
                </span>

            </a>



            <!-- MY PROGRESS -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-chart-line fa-fade"></i>

                <span>
                    My Progress
                </span>

            </a>



            <!-- MEMBERSHIP EXPIRY ALERT -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-triangle-exclamation fa-shake"></i>

                <span>
                    Expiry Alert
                </span>

            </a>



            <!-- NOTIFICATIONS -->

            <a
                href="#"
                class="member-menu-item">

                <i class="fa-solid fa-bell fa-shake"></i>

                <span>
                    Notifications
                </span>

            </a>


        </nav>



        <!-- ====================================
             SIDEBAR FOOTER
        ===================================== -->

        <div class="member-sidebar-footer">


            <!-- LOGOUT -->

            <a
                href="#"
                class="member-menu-item logout-item"id="memberLogout">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Logout
                </span>

            </a>


        </div>


    </aside>



    <!-- ========================================
         MEMBER SIDEBAR JAVASCRIPT
    ========================================= -->

    <script src="member-sidebar.js"></script>


</body>

</html>
